<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* Login Section Styles */
        h2 { margin-top: 0; color: var(--primary); text-align: center; }
        
        .input-group { margin-bottom: 15px; }
        input {
            width: 100%; padding: 14px; box-sizing: border-box;
            border: 1px solid #e5e7eb; border-radius: 8px;
            font-size: 16px; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); outline: none; }
        
        button {
            width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 16px;
            font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        button:hover { background-color: #4338ca; }
        
        .loader {
            display: none; text-align: center;
            margin-top: 15px; font-size: 14px; color: var(--primary);
            font-weight: 600;
        }

        /* Dashboard Section Styles */
        #dashboard-view { display: none; text-align: center; }
        
        .student-info { margin-bottom: 30px; }
        .student-name { font-size: 24px; font-weight: 700; margin: 0; }
        .roll-badge {
            display: inline-block; background: #e0e7ff; color: var(--primary);
            padding: 6px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; margin-top: 10px;
        }

        /* Circular Progress Bar */
        .progress-circle {
            position: relative; width: 160px; height: 160px;
            margin: 0 auto 20px;
        }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        circle {
            fill: none; stroke-width: 12; stroke-linecap: round;
        }
        .bg-circle { stroke: #e5e7eb; }
        .progress {
            stroke: var(--success);
            stroke-dasharray: 440; 
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 1.5s ease-out, stroke 0.5s ease;
        }
        
        .percentage-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px; font-weight: 800;
        }
        
        .attendance-label {
            font-size: 16px; color: var(--text-muted); font-weight: 500;
        }

        /* New Stats Row Styles */
        .stats-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f3f4f6;
        }
        .stat-box {
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .val-present { color: var(--success); }
        .val-absent { color: var(--danger); }
        .val-total { color: var(--text-main); }

        .back-btn {
            background-color: transparent; color: var(--text-muted);
            box-shadow: none; margin-top: 25px; font-size: 14px;
        }
        .back-btn:hover { background-color: #f3f4f6; color: var(--text-main); }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN VIEW -->
        <div class="card" id="login-view">
            <h2>CampX Portal</h2>
            <div class="input-group">
                <input type="email" id="loginId" placeholder="College Email ID" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button onclick="fetchAttendance()">View Attendance</button>
            <div id="loading" class="loader">Logging in & syncing data...</div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div class="card" id="dashboard-view">
            <div class="student-info">
                <h3 class="student-name" id="display-name">Student Name</h3>
                <div class="roll-badge" id="display-roll">Roll No</div>
            </div>

            <div class="progress-circle">
                <svg>
                    <circle class="bg-circle" cx="80" cy="80" r="70"></circle>
                    <circle class="progress" id="progress-bar" cx="80" cy="80" r="70"></circle>
                </svg>
                <div class="percentage-text" id="display-percentage">0%</div>
            </div>
            
            <div class="attendance-label">Primary Attendance</div>

            <!-- New Stats Row -->
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value val-total" id="display-total">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value val-present" id="display-present">0</div>
                    <div class="stat-label">Present</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value val-absent" id="display-absent">0</div>
                    <div class="stat-label">Absent</div>
                </div>
            </div>

            <button class="back-btn" onclick="logout()">← Check Another Account</button>
        </div>
    </div>

    <script>
        async function fetchAttendance() {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            
            if (!loginId || !password) {
                alert("Please enter both your email and password.");
                return;
            }

            document.getElementById('loading').style.display = "block";

            try {
                const response = await fetch("http://127.0.0.1:8000/api/attendance", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ loginId, password })
                });

                const data = await response.json();

                if (response.ok) {
                    processAndDisplayData(data, loginId);
                } else {
                    alert("Authentication Failed: Please check your credentials.");
                }
            } catch (error) {
                alert("Server Error: Make sure your Python backend is running.");
            } finally {
                document.getElementById('loading').style.display = "none";
            }
        }

        function processAndDisplayData(data, loginId) {
            // 1. Data Extraction
            const studentInfo = data.student || {};
            const rollNo = studentInfo.rollNo || loginId.split('@')[0].toUpperCase();
            const studentName = studentInfo.fullName || "Student";
            
            // Percentage Data
            const attendance = data.attendancePercentage || (data.primaryAttendance ? data.primaryAttendance.percentage : 0);

            // Detailed Class Stats Data
            const totalClasses = data.primaryAttendance ? data.primaryAttendance.totalSessionsIncludingActivity : 0;
            const presentClasses = data.primaryAttendance ? data.primaryAttendance.present : 0;
            const absentClasses = data.primaryAttendance ? data.primaryAttendance.absent : 0;

            // 2. Update Basic UI Elements
            document.getElementById('display-name').textContent = studentName;
            document.getElementById('display-roll').textContent = rollNo;
            
            const formattedAttendance = parseFloat(attendance).toFixed(1);
            document.getElementById('display-percentage').textContent = formattedAttendance + '%';

            // 3. Update Detailed Class Stats UI
            document.getElementById('display-total').textContent = totalClasses;
            document.getElementById('display-present').textContent = presentClasses;
            document.getElementById('display-absent').textContent = absentClasses;

            // 4. Animate the SVG Circular Progress Bar
            const circle = document.getElementById('progress-bar');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            const offset = circumference - (formattedAttendance / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            // 5. Dynamic Coloring
            if (formattedAttendance >= 75.0) {
                circle.style.stroke = "var(--success)"; // Green
            } else {
                circle.style.stroke = "var(--danger)"; // Red
            }

            // 6. Switch Views
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
        }

        function logout() {
            document.getElementById('password').value = "";
            
            const circle = document.getElementById('progress-bar');
            circle.style.strokeDashoffset = 440; 
            
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
        }
    </script>
</body>
</html>
